[project]
name = "genial-agent"
version = "0.1.0"
description = "Agent IA spécialisé entreprises françaises via MCP Pappers"
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Lancelot Oudin" }]
dependencies = [
    "anthropic>=0.97.0,<0.98",
    "mcp>=1.27.0,<2",
    "chainlit>=2.11.1,<3",
    "pydantic>=2.13.3,<3",
    "structlog>=25.5.0,<26",
    "python-dotenv>=1.2.2,<2",
    "tenacity>=9.1.4,<10",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.3.0,<2",
    "pytest-cov>=7.1.0,<8",
    "ruff>=0.15.11,<0.16",
    "pre-commit>=4.6.0,<5",
]

[build-system]
requires = ["hatchling>=1.29.0,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/genial_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
# Exclusion par défaut du marker ``integration`` : les tests live
# (Anthropic + Pappers) coûtent des crédits et prennent plusieurs
# minutes. Les Dev Agents et Review Agents de S04+ n'ont pas besoin
# de les rejouer — ils consomment le contrat de S03 (events, signatures)
# pas ses logs. Pour les jouer explicitement :
#
#   make test-integration     # ou : pytest -m integration tests/integration
#
# ``make test`` / ``make test-unit`` restent rapides et gratuits.
# Détails dans docs/stories/S03-agent-core.md §"Stratégie de tests".
addopts = "-ra --strict-markers --strict-config -m 'not integration'"
markers = [
    "integration: live tests against real API keys (opt-in, consomme des crédits). Run via make test-integration.",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", ".chainlit", "dist", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "UP", "S"]
ignore = [
    "S101",  # assert OK (tests + pré-conditions internes)
    "E501",  # ligne longue — ruff format gère
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]  # pas de check sécurité dans les tests
