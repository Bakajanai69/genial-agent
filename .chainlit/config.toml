[project]
# List of environment variables to be provided by each user to use the app.
user_env = []

# Duration (in seconds) during which the session is saved when the connection is lost
session_timeout = 3600

# Duration (in seconds) of the user session expiry
user_session_timeout = 1296000  # 15 days

# Enable third parties caching (e.g., LangChain cache)
cache = false

# Whether to persist user environment variables (API keys) to the database
# Set to true to store user env vars in DB, false to exclude them for security
persist_user_env = false

# Whether to mask user environment variables (API keys) in the UI with password type
# Set to true to show API keys as ***, false to show them as plain text
mask_user_env = false

# Authorized origins.
# Durci S08 review §B3 (post-deploy) : on retire le wildcard ``["*"]`` qui
# laissait n'importe quel site malveillant iframe / proxy le chat (CSRF
# Socket.IO, clickjacking). On liste explicitement :
#   - le domaine Railway prod (URL publique unique) ;
#   - les origins localhost classiques pour le dev local + smoke tests
#     Docker (``make run`` et ``docker run -p 8000:8000``).
# Note pratique : l'accès via proxy d'entreprise ne change PAS l'origin
# côté navigateur (l'URL bar reste la prod), donc cette liste n'empêche
# pas les évaluateurs derrière un proxy. Ajouter d'autres entrées ici
# si un custom domain est configuré (cf. docs/deployment.md).
allow_origins = [
    "https://genial-agent-production.up.railway.app",
    "http://localhost:8000",
    "http://localhost:8765",
    "http://127.0.0.1:8000",
    "http://127.0.0.1:8765",
]

[features]
# Process and display HTML in messages. This can be a security risk (see https://stackoverflow.com/questions/19603097/why-is-it-dangerous-to-render-user-generated-html-or-javascript)
unsafe_allow_html = false

# Process and display mathematical expressions. This can clash with "$" characters in messages.
latex = false

# Enable rendering of user messages markdown
user_message_markdown = true

# Autoscroll new user messages at the top of the window
user_message_autoscroll = true

# Autoscroll new assistant messages
assistant_message_autoscroll = true

# Pas de chat profile en S06 — auto_tag est inutile.
auto_tag_thread = false

# Allow users to edit their own messages.
# Disabled : on n'a pas implémenté ``@cl.on_message_edit`` côté backend
# (S06 hors scope), un edit user déclencherait un comportement non défini.
edit_message = false

# Allow users to share threads (backend + UI). Requires an app-defined on_shared_thread_view callback.
allow_thread_sharing = false

# Enable favorite messages
favorites = false

[features.slack]
# Add emoji reaction when message is received (requires reactions:write OAuth scope)
reaction_on_message_received = false

# Authorize users to spontaneously upload files with messages.
# Désactivé S06 : l'agent ne traite aucun fichier. Garder ``enabled =
# true`` afficherait un bouton "joindre un fichier" qui ne fait rien
# (UX confuse) et ouvrirait une surface d'attaque inutile (500 Mo
# d'upload accepté avec ``accept = ["*/*"]``).
[features.spontaneous_file_upload]
    enabled = false
    accept = []
    max_files = 0
    max_size_mb = 0

[features.audio]
    # Enable audio features
    enabled = false
    # Sample rate of the audio
    sample_rate = 24000

# Chainlit-side MCP features. Notre agent appelle son **propre** MCP
# Pappers côté serveur via ``mcp_pappers.py`` (cf. S02) — l'utilisateur
# final ne configure aucun MCP. On désactive donc tous les sous-modes,
# y compris le ``stdio`` qui aurait permis l'exécution arbitraire de
# ``npx``/``uvx`` côté backend Chainlit (défense en profondeur si
# ``features.mcp.enabled`` était re-toggle par mégarde).
[features.mcp]
    enabled = false

[features.mcp.sse]
    enabled = false

[features.mcp.streamable-http]
    enabled = false

[features.mcp.stdio]
    enabled = false
    # ``allowed_executables`` est requis (parsing Chainlit) — on le garde
    # vide pour neutraliser toute exécution même si l'utilisateur (ou un
    # bug Chainlit) re-active ``features.mcp.stdio.enabled`` à chaud.
    allowed_executables = []

[UI]
# Name of the assistant.
name = "Agent entreprises FR · via Pappers"

default_theme = "dark"

# Locale UI : on laisse Chainlit autodétecter depuis le navigateur.
# Forcer ``language = "fr-FR"`` sans peupler ``.chainlit/translations/``
# fait fallback en-US sur les libellés Chainlit (boutons "Send", "New
# chat") avec un avertissement console — pire UX qu'un autodétect.
# Le contenu de nos messages est déjà 100 % FR (system prompt + UI S06).
# language = "fr-FR"

# layout = "wide"

# S09.7 UI : ouvrir la sidebar par défaut pour exposer la liste des
# conversations passées (data layer SQLite anonymous, persisté sur le
# volume Railway via ``CHAINLIT_DATA_LAYER_DB_PATH``). Sans ce flag,
# Chainlit ouvrait la sidebar fermée par défaut → l'utilisateur ne
# voyait pas qu'il avait un historique restorable.
default_sidebar_state = "open"

# Chat settings display location: "message_composer" (default) or "sidebar" (header)
# chat_settings_location = "message_composer"

# Default state of chat settings sidebar when location is "sidebar"
# default_chat_settings_open = false

# Whether to prompt user confirmation on clicking 'New Chat'.
# Désactivé pour la démo : Fabien doit pouvoir enchaîner les starters
# sans popup intempestive entre chaque scénario de test.
confirm_new_chat = false

# Description of the assistant. This is used for HTML tags.
# description = ""

# Chain of Thought (CoT) display mode. Can be "hidden", "tool_call" or "full".
cot = "full"

# Footer RGPD permanent — cf. cahier §16.4 et docs/stories/S06-chainlit-ui.md.
custom_css = "/public/footer.css"

# Specify additional attributes for a custom CSS file
# custom_css_attributes = "media=\"print\""

# S10 — bootstrap qui (a) préserve intégralement le comportement de
# ``public/owner-cookie.js`` (cookie ``genial_owner_id`` + splash
# anti-FOUC, S09.7) et (b) injecte le widget ``<elevenlabs-convai>`` si
# voice mode est activé côté serveur (fetch ``/voice-meta.html``,
# 404 = skip silencieux). Chainlit n'autorise qu'un seul ``custom_js``
# (string, pas array) → fusion forcée dans un unique fichier.
custom_js = "/public/eleven-widget-bootstrap.js"

# The style of alert boxes. Can be "classic" or "modern".
alert_style = "classic"

# Specify additional attributes for custom JS file
# custom_js_attributes = "async type = \"module\""

# Custom login page image, relative to public directory or external URL
# login_page_image = "/public/custom-background.jpg"

# Custom login page image filter (Tailwind internal filters, no dark/light variants)
# login_page_image_filter = "brightness-50 grayscale"
# login_page_image_dark_filter = "contrast-200 blur-sm"

# Specify a custom meta URL (used for meta tags like og:url)
# custom_meta_url = "https://github.com/Chainlit/chainlit"

# Specify a custom meta image url.
# custom_meta_image_url = "https://chainlit-cloud.s3.eu-west-3.amazonaws.com/logo/chainlit_banner.png"

# Load assistant logo / avatar directly from URL.
# Strings vides peuvent déclencher un fetch sur ``""`` côté frontend —
# on commente plutôt qu'on laisse vide.
# logo_file_url = ""
# default_avatar_file_url = ""

# Avatar size in pixels (default: 20).
# avatar_size = 20

# Specify a custom build directory for the frontend.
# This can be used to customize the frontend code.
# Be careful: If this is a relative path, it should not start with a slash.
# custom_build = "./public/build"

